<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a150f" />
      <stop offset="100%" stop-color="#050a07" />
    </linearGradient>
    <linearGradient id="matchaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="256" height="256" rx="56" fill="url(#bgGrad)" />
  <rect width="254" height="254" x="1" y="1" rx="55" fill="none" stroke="rgba(52, 211, 153, 0.25)" stroke-width="2" />

  <!-- Outer Gallery Frame -->
  <rect x="44" y="44" width="168" height="168" rx="28" fill="none" stroke="url(#matchaGrad)" stroke-width="8" stroke-dasharray="16 8" filter="url(#glow)" opacity="0.85" />
  <rect x="58" y="58" width="140" height="140" rx="20" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" />

  <!-- Stylized Geometric Matcha Tea Leaf & Aperture Core -->
  <g transform="translate(128, 128)">
    <!-- Central Leaf Path -->
    <path d="M 0,-48 C 34,-34 50,0 42,32 C 34,60 0,66 0,66 C 0,66 -34,60 -42,32 C -50,0 -34,-34 0,-48 Z" fill="url(#matchaGrad)" filter="url(#glow)" />
    <!-- Leaf Center Stem -->
    <path d="M 0,-38 C 0,-10 0,25 0,55" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <!-- Leaf Veins -->
    <path d="M 0,-15 Q 16,-6 24,6" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <path d="M 0,-2 Q -16,8 -24,20" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <path d="M 0,16 Q 14,24 20,32" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6" />

    <!-- AI Sparkle / Star in top-right -->
    <path d="M 38,-38 Q 44,-38 44,-44 Q 44,-38 50,-38 Q 44,-38 44,-32 Q 44,-38 38,-38 Z" fill="url(#goldGrad)" />
  </g>
</svg>
